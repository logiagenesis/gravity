<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      NOTE: no maximum-scale and no user-scalable=no. Restricting zoom fails
      WCAG 2.2 SC 1.4.4 (Resize Text) and is a defect we specifically set out
      not to repeat.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <!--
      Content Security Policy as a meta tag.

      GitHub Pages serves no custom response headers, so public/_headers (kept
      for the secondary Cloudflare Pages deployment) has no effect there. A meta
      CSP is the only mechanism available on Pages.

      Meta-delivered CSP cannot express frame-ancestors, report-uri or sandbox,
      and cannot deliver HSTS at all. Those remain header-only; the gap is
      recorded in docs/security-headers.md rather than papered over.

      style-src allows 'unsafe-inline' because React and the renderer set inline
      styles. script-src stays 'self' with no 'unsafe-inline' and no
      'unsafe-eval', so script injection is still blocked.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="theme-color" content="#070a12" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

    <title>Gravity Simulator — interactive n-body orbital mechanics</title>
    <meta
      name="description"
      content="An interactive 3D Newtonian n-body gravity simulator. Explore the solar system, three-body choreographies and Lagrange points, with cited data and visible conservation diagnostics."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gravity Simulator" />
    <meta
      property="og:title"
      content="Gravity Simulator — interactive n-body orbital mechanics"
    />
    <meta
      property="og:description"
      content="An interactive 3D Newtonian n-body gravity simulator with cited data and visible conservation diagnostics."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--SEO-->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p
        style="
          padding: 2rem;
          color: #eef2f8;
          background: #070a12;
          font-family: system-ui;
        "
      >
        This gravity simulator needs JavaScript, because it runs a numerical physics
        simulation in your browser. The scenario data and its sources are published as
        JSON under <code>/scenarios/</code> if you would rather read the numbers
        directly.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
