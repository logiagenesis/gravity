name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The catalogue manifest and search index are generated build artefacts
      # (gitignored) that the app's TypeScript imports. They must exist before
      # typecheck runs, or tsc cannot resolve them. CI caught exactly this.
      - name: Generate catalogue
        run: npm run data:build

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Dependency licence gate
        run: npm run licences

      - name: Unit and physics regression tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Assert no foreign domain is published as our own
        run: |
          if grep -rl "gravitysimulator\.org" dist/ 2>/dev/null; then
            echo "::error::dist/ references gravitysimulator.org, a domain we do not own"
            exit 1
          fi
          echo "dist/ is clean of foreign canonical URLs"

      - name: Verify sitemap and robots were generated
        run: |
          # CI builds with SITE_URL unset, so the CORRECT result is a robots.txt
          # with no Sitemap line and no sitemap.xml at all. Assert that, rather
          # than asserting the presence of a file that would have to name a
          # guessed domain.
          test -f dist/robots.txt || { echo "::error::dist/robots.txt missing"; exit 1; }
          if [ -f dist/sitemap.xml ]; then
            echo "::error::sitemap.xml was emitted without SITE_URL set"
            exit 1
          fi
          grep -q "No Sitemap line" dist/robots.txt || { echo "::error::robots.txt should explain the missing Sitemap line"; exit 1; }
          echo "robots.txt correctly omits the Sitemap line when SITE_URL is unset"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Make every branch's build inspectable without deploying it.
      - name: Upload built site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: warn

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
