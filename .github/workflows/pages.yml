# Deploy to GitHub Pages.
#
# Action versions were checked against each action's releases page on
# 2026-09-21 rather than recalled: configure-pages v6, upload-pages-artifact v5,
# deploy-pages v5.
#
# The site URL and base path are passed in as configuration. There is no default
# anywhere in the build, so a misconfigured deploy emits no canonical rather
# than a wrong one. See scripts/lib/site-config.ts.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer commit supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://logiagenesis.github.io/gravity
  BASE_PATH: /gravity/

jobs:
  # Deploy only after the full verification chain passes. A broken deploy is
  # worse than a late one.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run data:build
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run licences
      - run: npm test
      - run: npm run build
      - name: Assert no foreign domain is published as our own
        run: |
          if grep -rl "gravitysimulator\.org" dist/ 2>/dev/null; then
            echo "::error::dist/ references gravitysimulator.org, a domain we do not own"
            exit 1
          fi
          echo "dist/ is clean of foreign canonical URLs"
      - name: Assert SEO artefacts exist and agree
        run: |
          test -f dist/sitemap.xml || { echo "::error::dist/sitemap.xml missing"; exit 1; }
          test -f dist/robots.txt || { echo "::error::dist/robots.txt missing"; exit 1; }
          grep -q "${SITE_URL}/sitemap.xml" dist/robots.txt || { echo "::error::robots.txt does not point at our sitemap"; exit 1; }
          grep -q "rel=\"canonical\" href=\"${SITE_URL}/\"" dist/index.html || { echo "::error::canonical missing or wrong"; exit 1; }
          echo "sitemap, robots and canonical all consistent"
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
